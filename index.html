<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS HUD AI</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background: #030008;
            color: #c77dff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .fog-purple, .fog-blue {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            pointer-events: none;
            opacity: 0.28;
        }
        .fog-purple {
            width: 380px;
            height: 380px;
            background: #9d4edd;
            top: 20%;
            left: 10%;
        }
        .fog-blue {
            width: 320px;
            height: 320px;
            background: #3a0ca3;
            bottom: 15%;
            right: 10%;
        }

        .hud-wrapper {
            width: 90%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 5;
            gap: 15px;
            text-align: center;
        }

        .top-hud {
            display: flex;
            justify-content: space-between;
            width: 100%;
            align-items: center;
            border-bottom: 1px solid rgba(199, 125, 255, 0.25);
            padding-bottom: 8px;
        }
        .hud-title {
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 4px;
            color: #e0aaff;
            text-shadow: 0 0 12px #9d4edd;
        }
        .hud-item {
            font-size: 11px;
            color: #e0aaff;
            letter-spacing: 1px;
        }

        .arc-wrapper {
            position: relative;
            width: 200px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 5px 0;
            transition: all 0.3s ease;
        }

        .holo-ring {
            position: absolute;
            border-radius: 50%;
        }
        .ring-outer {
            width: 190px;
            height: 190px;
            border: 2px solid rgba(199, 125, 255, 0.4);
            box-shadow: 0 0 20px rgba(157, 78, 221, 0.5);
            animation: rotateClockwise 10s linear infinite;
        }
        .ring-mid {
            width: 145px;
            height: 145px;
            border: 2px dotted #9d4edd;
            animation: rotateCounter 6s linear infinite;
        }
        .ring-dashes {
            width: 105px;
            height: 105px;
            border: 3px dashed #c77dff;
            animation: rotateClockwise 4s linear infinite;
        }
        .core-orb {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffffff 10%, #9d4edd 60%, #240046 100%);
            box-shadow: 0 0 30px #9d4edd;
            animation: pulseCore 2s infinite alternate;
        }

        .particle-track {
            position: absolute;
            width: 170px;
            height: 170px;
            animation: rotateClockwise 3s linear infinite;
        }
        .dot {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #ffffff;
            box-shadow: 0 0 8px #fff, 0 0 15px #c77dff;
            border-radius: 50%;
        }
        .d1 { top: 0; left: 50%; }
        .d2 { bottom: 0; left: 50%; }
        .d3 { top: 50%; left: 0; }
        .d4 { top: 50%; right: 0; }

        .speaking {
            transform: scale(1.15);
        }
        .speaking .core-orb {
            box-shadow: 0 0 55px #ffffff, 0 0 80px #9d4edd;
        }

        .sleeping {
            opacity: 0.5;
            transform: scale(0.9);
        }
        .sleeping .particle-track {
            animation-play-state: paused;
        }

        @keyframes rotateClockwise { 100% { transform: rotate(360deg); } }
        @keyframes rotateCounter { 100% { transform: rotate(-360deg); } }
        @keyframes pulseCore { 0% { transform: scale(0.9); opacity: 0.8; } 100% { transform: scale(1.1); opacity: 1; } }

        .state-label {
            font-size: 13px;
            letter-spacing: 3px;
            color: #e0aaff;
            text-shadow: 0 0 8px #9d4edd;
        }

        .dialogue-container {
            width: 100%;
            min-height: 80px;
            padding: 12px;
            text-align: left;
            background: rgba(25, 5, 59, 0.45);
            border-radius: 8px;
            border: 1px solid rgba(157, 78, 221, 0.3);
        }
        .speaker {
            font-size: 11px;
            font-weight: bold;
            color: #00f5d4;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }
        .hud-stream {
            font-size: 13px;
            color: #f3e8ff;
            line-height: 1.5;
            word-break: break-word;
        }

        .control-panel {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .input-bar {
            display: flex;
            gap: 8px;
            width: 100%;
        }
        .input-bar input {
            flex: 1;
            padding: 12px;
            background: rgba(157, 78, 221, 0.15);
            border: 1px solid #9d4edd;
            border-radius: 8px;
            color: #fff;
            outline: none;
            font-size: 13px;
            font-family: inherit;
        }
        .input-bar button {
            padding: 0 16px;
            background: #9d4edd;
            border: none;
            border-radius: 8px;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
        }
        .holo-btn {
            width: 100%;
            background: rgba(157, 78, 221, 0.25);
            border: 1px solid #9d4edd;
            color: #ffffff;
            padding: 13px;
            border-radius: 8px;
            cursor: pointer;
            letter-spacing: 3px;
            font-size: 13px;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(157, 78, 221, 0.3);
            transition: 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="fog-purple"></div>
    <div class="fog-blue"></div>

    <div class="hud-wrapper">
        <div class="top-hud">
            <div class="hud-item"><span class="hud-icon">⚡</span> <span id="battery">100%</span></div>
            <div class="hud-title">JARVIS SYSTEM</div>
            <div class="hud-item"><span class="hud-icon">⏱</span> <span id="clock">00:00:00</span></div>
        </div>

        <div class="arc-wrapper" id="arcCore">
            <div class="holo-ring ring-outer"></div>
            <div class="holo-ring ring-mid"></div>
            <div class="holo-ring ring-dashes"></div>
            <div class="particle-track">
                <span class="dot d1"></span>
                <span class="dot d2"></span>
                <span class="dot d3"></span>
                <span class="dot d4"></span>
            </div>
            <div class="core-orb"></div>
        </div>

        <div class="state-label" id="jarvisState">JARVIS ONLINE</div>

        <div class="dialogue-container">
            <p id="speakerTag" class="speaker">JARVIS</p>
            <p id="hudText" class="hud-stream">System Online Boss! Type karein ya Voice button dabayein.</p>
        </div>

        <div class="control-panel">
            <div class="input-bar">
                <input type="text" id="cmdInput" placeholder="Sawal pucho ya gana bolo...">
                <button id="sendBtn">SEND</button>
            </div>
            <button id="toggleBtn" class="holo-btn">
                <span id="btnIcon" class="btn-text">🎤 WAKE UP & TALK</span>
            </button>
        </div>
    </div>

    <script>
        // ================= CONFIGURATION KEYS =================
        const GROQ_API_KEY = "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"; 
        const ELEVENLABS_API_KEY = "sk_592bfba04e770a42e0033854f35f28eca0cd6eb8afac2ec3"; 
        const ELEVENLABS_VOICE_ID = "pNInz6obpgDQGcFmaJgB"; // Deep natural male voice (Adam)

        let isListening = false;
        let currentAudio = null;
        let currentTypingInterval = null;

        const JARVIS_SYSTEM_PROMPT = `
        Tumhara naam JARVIS hai. Tum Shivam ke ek behad powerful PC style AI assistant ho.
        Tumhara bolne ka andaz polite, intelligent, loyal, natural aur friendly ladke jaisa hai.
        Har generic sawal ka jawab ChatGPT ya Gemini ki tarah smart instantly Hinglish me do.
        `;

        const arcCore = document.getElementById("arcCore");
        const jarvisState = document.getElementById("jarvisState");
        const hudText = document.getElementById("hudText");
        const speakerTag = document.getElementById("speakerTag");
        const toggleBtn = document.getElementById("toggleBtn");
        const btnIcon = document.getElementById("btnIcon");
        const cmdInput = document.getElementById("cmdInput");
        const sendBtn = document.getElementById("sendBtn");
        const clockEl = document.getElementById("clock");
        const batteryEl = document.getElementById("battery");

        setInterval(() => {
            const now = new Date();
            clockEl.innerText = now.toTimeString().split(" ")[0];
        }, 1000);

        if (navigator.getBattery) {
            navigator.getBattery().then(b => {
                const setBat = () => { batteryEl.innerText = `${Math.round(b.level * 100)}%`; };
                setBat();
                b.addEventListener("levelchange", setBat);
            });
        }

        function renderHoloText(text, speaker = "JARVIS") {
            speakerTag.innerText = speaker;
            hudText.innerText = "";
            if (currentTypingInterval) clearInterval(currentTypingInterval);

            let i = 0;
            currentTypingInterval = setInterval(() => {
                if (i < text.length) {
                    hudText.innerText += text.charAt(i);
                    i++;
                } else {
                    clearInterval(currentTypingInterval);
                }
            }, 15);
        }

        async function speakWithElevenLabs(text) {
            try {
                const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${ELEVENLABS_VOICE_ID}`, {
                    method: "POST",
                    headers: {
                        "xi-api-key": ELEVENLABS_API_KEY,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        text: text,
                        model_id: "eleven_multilingual_v2",
                        voice_settings: {
                            stability: 0.45,
                            similarity_boost: 0.85
                        }
                    })
                });

                if (!response.ok) throw new Error("ElevenLabs failed");

                const blob = await response.blob();
                const audioUrl = URL.createObjectURL(blob);
                currentAudio = new Audio(audioUrl);
                
                arcCore.className = "arc-wrapper speaking";
                jarvisState.innerText = "JARVIS RESPONDING...";

                currentAudio.onended = () => {
                    arcCore.className = "arc-wrapper";
                    jarvisState.innerText = "JARVIS ONLINE";
                };

                await currentAudio.play();
                return true;
            } catch (err) {
                return false;
            }
        }

        async function speak(text) {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }
            window.speechSynthesis.cancel();
            renderHoloText(text, "JARVIS");

            // ElevenLabs check
            if (ELEVENLABS_API_KEY && !ELEVENLABS_API_KEY.includes("sk_592bfba04e770a42e0033854f35f28eca0cd6eb8afac2ec3")) {
                const success = await speakWithElevenLabs(text);
                if (success) return;
            }

            // Fallback Voice
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = "hi-IN";

            const voices = window.speechSynthesis.getVoices();
            const maleVoice = voices.find(v => 
                (v.lang.includes("hi") || v.lang.includes("IN")) && 
                (v.name.toLowerCase().includes("male") || v.name.toLowerCase().includes("madhur") || v.name.toLowerCase().includes("google hi-in"))
            ) || voices.find(v => v.lang.includes("hi"));

            if (maleVoice) utterance.voice = maleVoice;
            utterance.pitch = 0.75;
            utterance.rate = 1.0;

            arcCore.className = "arc-wrapper speaking";
            jarvisState.innerText = "JARVIS RESPONDING...";

            utterance.onend = () => {
                arcCore.className = "arc-wrapper";
                jarvisState.innerText = "JARVIS ONLINE";
            };

            window.speechSynthesis.speak(utterance);
        }

        async function queryGroqAI(query) {
            jarvisState.innerText = "THINKING...";
            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${GROQ_API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        temperature: 0.6,
                        max_tokens: 300,
                        messages: [
                            { role: "system", content: JARVIS_SYSTEM_PROMPT },
                            { role: "user", content: query }
                        ]
                    })
                });

                const res = await response.json();
                const output = res.choices[0].message.content;
                speak(output);
            } catch (e) {
                speak("Sun raha hu Boss, boliye!");
            }
        }

        function checkCustomCommands(input) {
            const cmd = input.toLowerCase();

            // 1. Ashish Secret Dialogue (Single Clean Handler)
            if (cmd.includes("ashish ki gf") || (cmd.includes("ashish") && cmd.includes("gf"))) {
                speak("Uski gf? Uski gf to Ziya hai Boss, aapko nahi pata kya? Haan Ashish batata nahi jaldi kisi se, Ziya ke sath bas romance karta hai! Aur kya aapko pata hai, uski ek bestie bhi hai Hifza, wo to Ashish ko hamesha sweet mithai khilati hai! Kya Ashish aapko nahi deta ya batata iske baare me? Mujhe Ashish ke baare me sab pata hai!");
                return true;
            }

            // 2. Direct Song Play on YouTube
            if (cmd.includes("play") || cmd.includes("gana") || cmd.includes("song") || cmd.includes("chalao") || cmd.includes("bajao")) {
                let track = cmd.replace("play", "").replace("gana", "").replace("song", "").replace("chalao", "").replace("bajao", "").replace("jarvis", "").trim();
                if (!track) track = "Arijit Singh trending songs";
                
                speak(`Thik hai Boss, ${track} YouTube par chala raha hu.`);
                setTimeout(() => {
                    window.location.href = `https://www.youtube.com/results?search_query=${encodeURIComponent(track)}`;
                }, 2200);
                return true;
            }

            // 3. Open Gallery
            if (cmd.includes("gallery") || cmd.includes("photos") || cmd.includes("photo")) {
                speak("Gallery open kar raha hu Boss.");
                window.open("content://media/internal/images/media", "_blank");
                return true;
            }

            // 4. Calling
            if (cmd.includes("call") || cmd.includes("phone")) {
                const words = cmd.split(" ");
                let num = words.find(w => /^\d+$/.test(w) && w.length >= 5);
                if (num) {
                    speak(`Number ${num} par call laga raha hu.`);
                    window.open(`tel:${num}`, "_self");
                } else {
                    speak("Calling dialer open kar raha hu.");
                    window.open("tel:", "_self");
                }
                return true;
            }

            return false;
        }

        function processInput(voiceText) {
            if (!voiceText.trim()) return;
            renderHoloText(voiceText, "SHIVAM BOSS");
            const handled = checkCustomCommands(voiceText);
            if (!handled) {
                queryGroqAI(voiceText);
            }
        }

        sendBtn.addEventListener("click", () => {
            if (cmdInput.value.trim()) {
                processInput(cmdInput.value.trim());
                cmdInput.value = "";
            }
        });

        cmdInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter" && cmdInput.value.trim()) {
                processInput(cmdInput.value.trim());
                cmdInput.value = "";
            }
        });

        const SpeechEngine = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechEngine) {
            const recognizer = new SpeechEngine();
            recognizer.lang = "hi-IN";

            recognizer.onresult = (evt) => {
                const query = evt.results[0][0].transcript;
                processInput(query);
            };

            recognizer.onend = () => {
                jarvisState.innerText = "JARVIS ONLINE";
                btnIcon.innerText = "🎤 WAKE UP & TALK";
            };

            toggleBtn.addEventListener("click", () => {
                try {
                    recognizer.start();
                    jarvisState.innerText = "LISTENING...";
                    btnIcon.innerText = "LISTENING...";
                } catch(e) {
                    recognizer.stop();
                }
            });
        }
    </script>
</body>
</html>
