<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JARVIS ULTIMATE AI</title>
    <style>
        :root {
            --primary: #9d4edd;
            --secondary: #c77dff;
            --accent: #00f5d4;
            --bg-glow: #3a0ca3;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #030008;
            color: var(--secondary);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .fog-purple, .fog-blue {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            pointer-events: none;
            opacity: 0.28;
        }
        .fog-purple { width: 380px; height: 380px; background: var(--primary); top: 15%; left: 10%; }
        .fog-blue { width: 320px; height: 320px; background: var(--bg-glow); bottom: 15%; right: 10%; }

        .top-hud {
            position: absolute;
            top: 15px;
            width: 90%;
            max-width: 450px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding-bottom: 8px;
            z-index: 50;
        }
        .hud-title {
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 3px;
            color: #fff;
            text-shadow: 0 0 10px var(--primary);
        }
        .hud-item { font-size: 11px; color: var(--secondary); letter-spacing: 1px; }

        /* Large Touch Target Settings Button */
        .settings-btn {
            background: rgba(157, 78, 221, 0.25);
            border: 1px solid var(--primary);
            color: #fff;
            width: 38px;
            height: 38px;
            border-radius: 8px;
            font-size: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 100;
        }

        .hud-wrapper {
            width: 90%;
            max-width: 420px;
            height: 85vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            z-index: 5;
            padding: 45px 0 15px 0;
            text-align: center;
        }

        .arc-wrapper {
            position: relative;
            width: 210px;
            height: 210px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.4s ease;
        }

        .holo-ring { position: absolute; border-radius: 50%; }
        .ring-outer {
            width: 200px; height: 200px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 20px var(--primary);
            animation: rotateCW 12s linear infinite;
        }
        .ring-mid {
            width: 155px; height: 155px;
            border: 2px dotted var(--primary);
            animation: rotateCCW 8s linear infinite;
        }
        .ring-dashes {
            width: 110px; height: 110px;
            border: 3px dashed var(--secondary);
            animation: rotateCW 4s linear infinite;
        }
        .core-orb {
            width: 50px; height: 50px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffffff 10%, var(--primary) 60%, #000 100%);
            box-shadow: 0 0 35px var(--primary);
            animation: pulseCore 2s infinite alternate;
        }

        .particle-track {
            position: absolute;
            width: 175px; height: 175px;
            animation: rotateCW 4s linear infinite;
        }
        .dot {
            position: absolute;
            width: 6px; height: 6px;
            background: #ffffff;
            box-shadow: 0 0 10px #fff, 0 0 15px var(--accent);
            border-radius: 50%;
        }
        .d1 { top: 0; left: 50%; }
        .d2 { bottom: 0; left: 50%; }
        .d3 { top: 50%; left: 0; }
        .d4 { top: 50%; right: 0; }

        .listening .particle-track { animation-duration: 1.2s; }
        .listening .ring-dashes { border-color: var(--accent); }
        .speaking { transform: scale(1.15); }
        .speaking .particle-track { animation-duration: 0.8s; }
        .speaking .core-orb { box-shadow: 0 0 65px #fff, 0 0 90px var(--primary); }
        .sleeping { opacity: 0.45; transform: scale(0.9); }
        .sleeping .particle-track { animation-play-state: paused; }

        @keyframes rotateCW { 100% { transform: rotate(360deg); } }
        @keyframes rotateCCW { 100% { transform: rotate(-360deg); } }
        @keyframes pulseCore { 0% { transform: scale(0.92); } 100% { transform: scale(1.08); } }

        .state-label {
            font-size: 13px;
            letter-spacing: 3px;
            color: #fff;
            text-shadow: 0 0 8px var(--primary);
        }

        .stream-box {
            width: 100%;
            height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            overflow: hidden;
            padding: 5px 10px;
        }
        .speaker-tag {
            font-size: 11px;
            font-weight: bold;
            color: var(--accent);
            letter-spacing: 2px;
            margin-bottom: 4px;
            text-align: left;
        }
        .hud-stream {
            font-size: 13px;
            color: #f3e8ff;
            line-height: 1.5;
            text-align: left;
            overflow-y: auto;
            max-height: 85px;
            word-break: break-word;
        }
        .hud-stream::-webkit-scrollbar { display: none; }

        .talk-btn {
            width: 100%;
            background: rgba(157, 78, 221, 0.2);
            border: 2px solid var(--primary);
            color: #ffffff;
            padding: 16px;
            border-radius: 12px;
            cursor: pointer;
            letter-spacing: 3px;
            font-size: 14px;
            font-weight: 900;
            box-shadow: 0 0 20px rgba(157, 78, 221, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: 0.3s ease;
        }
        .talk-btn:active { transform: scale(0.96); }
        .talk-btn.active {
            background: rgba(0, 245, 212, 0.2);
            border-color: var(--accent);
            box-shadow: 0 0 25px var(--accent);
            color: var(--accent);
        }

        /* 100% Reliable Full-Screen Settings Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(3, 0, 8, 0.95);
            backdrop-filter: blur(15px);
            z-index: 99999;
            justify-content: center;
            align-items: center;
        }
        .modal-box {
            width: 90%;
            max-width: 380px;
            max-height: 90vh;
            background: #0e021a;
            border: 1px solid var(--primary);
            border-radius: 14px;
            padding: 20px;
            overflow-y: auto;
            text-align: left;
            color: #fff;
            box-shadow: 0 0 30px rgba(157, 78, 221, 0.5);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 8px;
        }
        .modal-header h3 { font-size: 15px; letter-spacing: 2px; color: var(--secondary); }
        .close-modal-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: #fff;
            width: 32px; height: 32px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
        }

        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 11px; color: var(--secondary); letter-spacing: 1px; margin-bottom: 5px; }
        .form-group input, .form-group select {
            width: 100%;
            padding: 11px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(199, 125, 255, 0.3);
            border-radius: 6px;
            color: #fff;
            outline: none;
            font-size: 12px;
            font-family: inherit;
        }
        .form-group select option { background: #120024; color: #fff; }

        .toggle-wrap { display: flex; align-items: center; justify-content: space-between; margin: 15px 0; }
        .toggle-switch {
            position: relative; width: 46px; height: 24px;
            background: #333; border-radius: 20px; cursor: pointer;
        }
        .toggle-switch::after {
            content: ''; position: absolute; top: 3px; left: 3px;
            width: 18px; height: 18px; background: #fff; border-radius: 50%;
            transition: 0.3s;
        }
        .toggle-switch.active { background: var(--accent); }
        .toggle-switch.active::after { left: 25px; }

        .save-btn {
            width: 100%;
            background: var(--primary);
            border: none;
            color: #fff;
            padding: 13px;
            border-radius: 8px;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <script>
        let config = {
            groqKey: localStorage.getItem("jarvis_groq") || "",

            gfMode: localStorage.getItem("jarvis_gf") === "true"

        const themes = {
            purple: { primary: "#9d4edd", secondary: "#c77dff", accent: "#00f5d4", bg: "#3a0ca3" },
            cyan: { primary: "#00d4ff", secondary: "#90e0ef", accent: "#0077b6", bg: "#03045e" },
            red: { primary: "#ff0055", secondary: "#ff758f", accent: "#ffb703", bg: "#590d22" },
            green: { primary: "#00f5d4", secondary: "#70e000", accent: "#38b000", bg: "#004b23" },
            gold: { primary: "#ffb703", secondary: "#ffe49e", accent: "#fb8500", bg: "#3d2b00" },
            pink: { primary: "#ff007f", secondary: "#ff85a1", accent: "#00f5d4", bg: "#4a0033" }

        function applyTheme(name) {
            const t = themes[name] || themes.purple;
            document.documentElement.style.setProperty('--primary', t.primary);
            document.documentElement.style.setProperty('--secondary', t.secondary);
            document.documentElement.style.setProperty('--accent', t.accent);
            document.documentElement.style.setProperty('--bg-glow', t.bg);
        }

        }

        // Modal Controls
        const settingsModal = document.getElementById("settingsModal");
        const openSettingsBtn = document.getElementById("openSettings");
        const closeSettingsBtn = document.getElementById("closeSettings");
        const arcCore = document.getElementById("arcCore");

        function showSettings() {
            settingsModal.style.display = "flex";
            groqKeyInput.value = config.groqKey;
            elevenKeyInput.value = config.elevenKey;
            ytKeyInput.value = config.ytKey;
            voiceSelect.value = config.voiceId;
            themeSelect.value = config.theme;
            if (config.gfMode) gfToggle.classList.add("active");
            else gfToggle.classList.remove("active");
        }

        function hideSettings() {
            settingsModal.style.display = "none";
        }

        gfToggle.onclick = () => gfToggle.classList.toggle("active");

        const groqKeyInput = document.getElementById("groqKeyInput");
        const elevenKeyInput = document.getElementById("elevenKeyInput");
        const ytKeyInput = document.getElementById("ytKeyInput");
        const voiceSelect = document.getElementById("voiceSelect");
        const themeSelect = document.getElementById("themeSelect");
        const saveSettings = document.getElementById("saveSettings");

        saveSettings.onclick = () => {
            config.groqKey = groqKeyInput.value.trim();
            config.elevenKey = elevenKeyInput.value.trim();
            config.ytKey = ytKeyInput.value.trim();
            config.voiceId = voiceSelect.value;
            config.theme = themeSelect.value;
            config.gfMode = gfToggle.classList.contains("active");

            localStorage.setItem("jarvis_groq", config.groqKey);
            localStorage.setItem("jarvis_eleven", config.elevenKey);
            localStorage.setItem("jarvis_yt", config.ytKey);
            localStorage.setItem("jarvis_voice", config.voiceId);
            localStorage.setItem("jarvis_theme", config.theme);
            localStorage.setItem("jarvis_gf", config.gfMode);

            hideSettings();
            speak("Settings saved! System fully operational Shivam Boss.");
