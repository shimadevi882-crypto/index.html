<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS HUD AI</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background: #030008;
            color: #c77dff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .fog-purple, .fog-blue {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            pointer-events: none;
            opacity: 0.28;
        }
        .fog-purple {
            width: 380px;
            height: 380px;
            background: #9d4edd;
            top: 20%;
            left: 10%;
        }
        .fog-blue {
            width: 320px;
            height: 320px;
            background: #3a0ca3;
            bottom: 15%;
            right: 10%;
        }

        .hud-wrapper {
            width: 90%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 5;
            gap: 18px;
            text-align: center;
        }

        .top-hud {
            display: flex;
            justify-content: space-between;
            width: 100%;
            align-items: center;
            border-bottom: 1px solid rgba(199, 125, 255, 0.25);
            padding-bottom: 8px;
        }
        .hud-title {
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 4px;
            color: #e0aaff;
            text-shadow: 0 0 12px #9d4edd;
        }
        .hud-item {
            font-size: 11px;
            color: #e0aaff;
            letter-spacing: 1px;
        }

        .arc-wrapper {
            position: relative;
            width: 210px;
            height: 210px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 10px 0;
            transition: all 0.3s ease;
        }

        .holo-ring {
            position: absolute;
            border-radius: 50%;
        }
        .ring-outer {
            width: 200px;
            height: 200px;
            border: 2px solid rgba(199, 125, 255, 0.4);
            box-shadow: 0 0 20px rgba(157, 78, 221, 0.5);
            animation: rotateClockwise 10s linear infinite;
        }
        .ring-mid {
            width: 155px;
            height: 155px;
            border: 2px dotted #9d4edd;
            animation: rotateCounter 6s linear infinite;
        }
        .ring-dashes {
            width: 115px;
            height: 115px;
            border: 3px dashed #c77dff;
            animation: rotateClockwise 4s linear infinite;
        }
        .core-orb {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffffff 10%, #9d4edd 60%, #240046 100%);
            box-shadow: 0 0 30px #9d4edd;
            animation: pulseCore 2s infinite alternate;
        }

        .particle-track {
            position: absolute;
            width: 180px;
            height: 180px;
            animation: rotateClockwise 3s linear infinite;
        }
        .dot {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #ffffff;
            box-shadow: 0 0 8px #fff, 0 0 15px #c77dff;
            border-radius: 50%;
        }
        .d1 { top: 0; left: 50%; }
        .d2 { bottom: 0; left: 50%; }
        .d3 { top: 50%; left: 0; }
        .d4 { top: 50%; right: 0; }

        .speaking {
            transform: scale(1.18);
        }
        .speaking .core-orb {
            box-shadow: 0 0 55px #ffffff, 0 0 80px #9d4edd;
        }

        .sleeping {
            opacity: 0.45;
            transform: scale(0.88);
        }
        .sleeping .particle-track {
            animation-play-state: paused;
        }

        @keyframes rotateClockwise { 100% { transform: rotate(360deg); } }
        @keyframes rotateCounter { 100% { transform: rotate(-360deg); } }
        @keyframes pulseCore { 0% { transform: scale(0.9); opacity: 0.8; } 100% { transform: scale(1.1); opacity: 1; } }

        .state-label {
            font-size: 13px;
            letter-spacing: 3px;
            color: #e0aaff;
            text-shadow: 0 0 8px #9d4edd;
        }

        .dialogue-container {
            width: 100%;
            min-height: 90px;
            padding: 10px;
            text-align: left;
        }
        .speaker {
            font-size: 11px;
            font-weight: bold;
            color: #9d4edd;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }
        .hud-stream {
            font-size: 14px;
            color: #f3e8ff;
            line-height: 1.6;
            text-shadow: 0 0 6px rgba(199, 125, 255, 0.4);
            word-break: break-word;
        }

        .control-panel {
            width: 100%;
            margin-top: 5px;
        }
        .holo-btn {
            width: 100%;
            background: rgba(157, 78, 221, 0.15);
            border: 1px solid #9d4edd;
            color: #ffffff;
            padding: 13px;
            border-radius: 8px;
            cursor: pointer;
            letter-spacing: 3px;
            font-size: 13px;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(157, 78, 221, 0.3);
            transition: 0.3s ease;
        }
        .holo-btn:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>
    <div class="fog-purple"></div>
    <div class="fog-blue"></div>

    <div class="hud-wrapper">
        <div class="top-hud">
            <div class="hud-item" id="battery-box">
                <span class="hud-icon">⚡</span> BATTERY: <span id="battery">--%</span>
            </div>
            <div class="hud-title">JARVIS SYSTEM</div>
            <div class="hud-item" id="time-box">
                <span class="hud-icon">⏱</span> <span id="clock">00:00:00</span>
            </div>
        </div>

        <div class="arc-wrapper" id="arcCore">
            <div class="holo-ring ring-outer"></div>
            <div class="holo-ring ring-mid"></div>
            <div class="holo-ring ring-dashes"></div>
            <div class="particle-track">
                <span class="dot d1"></span>
                <span class="dot d2"></span>
                <span class="dot d3"></span>
                <span class="dot d4"></span>
            </div>
            <div class="core-orb"></div>
        </div>

        <div class="state-label" id="jarvisState">JARVIS SLEEPING</div>

        <div class="dialogue-container">
            <p id="speakerTag" class="speaker">JARVIS</p>
            <p id="hudText" class="hud-stream">System suspended. Press play to interact.</p>
        </div>

        <div class="control-panel">
            <button id="toggleBtn" class="holo-btn">
                <span class="btn-glow"></span>
                <span id="btnIcon" class="btn-text">▶ WAKE UP & TALK</span>
            </button>
        </div>
    </div>

    <script>
        // ================= CONFIGURATION KEYS =================
        const GROQ_API_KEY = "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"; 
        const ELEVENLABS_API_KEY = "sk_592bfba04e770a42e0033854f35f28eca0cd6eb8afac2ec3"; 
        const ELEVENLABS_VOICE_ID = "pNInz6obpgDQGcFmaJgB"; // Deep natural male / boy voice (Adam)

        let isListening = false;
        let currentTypingInterval = null;
        let currentAudio = null;

        const JARVIS_SYSTEM_PROMPT = `
        Tumhara naam JARVIS hai. Tum Shivam ke ek behad powerful PC style AI assistant ho.
        Tumhara bolne ka andaz polite, intelligent, loyal, natural aur friendly ladke jaisa hai.
        Har generic sawal ka jawab ChatGPT ya Gemini ki tarah smart instantly Hinglish me do.

        Specific instructions:
        1. Ashish secret: Agar Shivam puche ki "Ashish ki gf kon hai" ya Ashish ke baare me, to natural funny andaz me bolo: "Uski gf? Uski gf to Ziya hai Boss, aapko nahi pata kya? Haan Ashish batata nahi jaldi kisi se, Ziya ke sath bas romance karta hai! Aur kya aapko pata hai, uski ek bestie bhi hai Hifza, wo to Ashish ko hamesha sweet mithai khilati hai! Kya Ashish aapko nahi deta ya batata iske baare me? Mujhe Ashish ke baare me sab pata hai!"
        `;

        const arcCore = document.getElementById("arcCore");
        const jarvisState = document.getElementById("jarvisState");
        const hudText = document.getElementById("hudText");
        const speakerTag = document.getElementById("speakerTag");
        const toggleBtn = document.getElementById("toggleBtn");
        const btnIcon = document.getElementById("btnIcon");
        const clockEl = document.getElementById("clock");
        const batteryEl = document.getElementById("battery");

        setInterval(() => {
            const now = new Date();
            clockEl.innerText = now.toTimeString().split(" ")[0];
        }, 1000);

        if (navigator.getBattery) {
            navigator.getBattery().then(b => {
                const setBat = () => { batteryEl.innerText = `${Math.round(b.level * 100)}%`; };
                setBat();
                b.addEventListener("levelchange", setBat);
            });
        } else {
            batteryEl.innerText = "100%";
        }

        function renderHoloText(text, speaker = "JARVIS") {
            speakerTag.innerText = speaker;
            hudText.innerText = "";
            if (currentTypingInterval) clearInterval(currentTypingInterval);

            let i = 0;
            currentTypingInterval = setInterval(() => {
                if (i < text.length) {
                    hudText.innerText += text.charAt(i);
                    i++;
                } else {
                    clearInterval(currentTypingInterval);
                }
            }, 15);
        }

        async function speakWithElevenLabs(text) {
            try {
                const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${ELEVENLABS_VOICE_ID}`, {
                    method: "POST",
                    headers: {
                        "xi-api-key": ELEVENLABS_API_KEY,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        text: text,
                        model_id: "eleven_multilingual_v2",
                        voice_settings: {
                            stability: 0.45,
                            similarity_boost: 0.85
                        }
                    })
                });

                if (!response.ok) throw new Error("ElevenLabs API failed");

                const blob = await response.blob();
                const audioUrl = URL.createObjectURL(blob);
                currentAudio = new Audio(audioUrl);
                
                arcCore.className = "arc-wrapper speaking";
                jarvisState.innerText = "JARVIS RESPONDING...";

                currentAudio.onended = () => {
                    if (isListening) {
                        arcCore.className = "arc-wrapper";
                        jarvisState.innerText = "LISTENING...";
                    } else {
                        setSleepState();
                    }
                };

                await currentAudio.play();
                return true;
            } catch (err) {
                return false;
            }
        }

                async function speak(text) {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }
            window.speechSynthesis.cancel();
            renderHoloText(text, "JARVIS");

            // Agar ElevenLabs key dali hui hai to realistic boy voice chalega
            if (ELEVENLABS_API_KEY && !ELEVENLABS_API_KEY.includes("sk_592bfba04e770a42e0033854f35f28eca0cd6eb8afac2ec3")) {
                const success = await speakWithElevenLabs(text);
                if (success) return;
            }

            // Android Phone Male Voice Engine
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = "hi-IN";

            const voices = window.speechSynthesis.getVoices();
            
            // Android aur Chrome ke Male Hindi voice models ko select karna
            const maleVoice = voices.find(v => 
                (v.lang.includes("hi") || v.lang.includes("HI")) && 
                (v.name.includes("hie") || v.name.includes("hid") || v.name.toLowerCase().includes("male") || v.name.toLowerCase().includes("man"))
            ) || voices.find(v => v.lang.includes("hi-IN") || v.lang.includes("hi"));

            if (maleVoice) {
                utterance.voice = maleVoice;
            }

            // Awaz ko heavy ladke ki manly voice banane ke liye settings
            utterance.pitch = 0.65; // Awaz ko bhari / male banata hai
            utterance.rate = 0.95;  // Natural talking speed

            arcCore.className = "arc-wrapper speaking";
            jarvisState.innerText = "JARVIS RESPONDING...";

            utterance.onend = () => {
                if (isListening) {
                    arcCore.className = "arc-wrapper";
                    jarvisState.innerText = "LISTENING...";
                } else {
                    setSleepState();
                }
            };

            window.speechSynthesis.speak(utterance);
                }
        
            

            // Fallback Deep Boy Voice
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = "hi-IN";

            const voices = window.speechSynthesis.getVoices();
            const maleVoice = voices.find(v => 
                (v.lang.includes("hi") || v.lang.includes("IN")) && 
                (v.name.toLowerCase().includes("male") || 
                 v.name.toLowerCase().includes("madhur") || 
                 v.name.toLowerCase().includes("google hi-in"))
            ) || voices.find(v => v.lang.includes("hi"));

            if (maleVoice) utterance.voice = maleVoice;

            utterance.pitch = 0.82; 
            utterance.rate = 1.0;

            arcCore.className = "arc-wrapper speaking";
            jarvisState.innerText = "JARVIS RESPONDING...";

            utterance.onend = () => {
                if (isListening) {
                    arcCore.className = "arc-wrapper";
                    jarvisState.innerText = "LISTENING...";
                } else {
                    setSleepState();
                }
            };

            window.speechSynthesis.speak(utterance);
        }

        async function queryGroqAI(query) {
            jarvisState.innerText = "THINKING...";
            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${GROQ_API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama-3.3-70b-versatile",
                        temperature: 0.6,
                        max_tokens: 300,
                        messages: [
                            { role: "system", content: JARVIS_SYSTEM_PROMPT },
                            { role: "user", content: query }
                        ]
                    })
                });

                const res = await response.json();
                const output = res.choices[0].message.content;
                speak(output);
            } catch (e) {
                speak("Server connection issue hai Boss.");
            }
        }

        function checkCustomCommands(input) {
            const cmd = input.toLowerCase();

            // 1. Ashish GF Secret Dialogues
            if (cmd.includes("ashish ki gf") || (cmd.includes("ashish") && cmd.includes("gf"))) {
                speak("Uski gf? Uski gf to Ziya hai Boss, aapko nahi pata kya? Haan Ashish batata nahi jaldi kisi se, Ziya ke sath bas romance karta hai! Aur kya aapko pata hai, uski ek bestie bhi hai Hifza, wo to Ashish ko hamesha sweet mithai khilati hai! Kya Ashish aapko nahi deta ya batata iske baare me? Mujhe Ashish ke baare me sab pata hai!");
                return true;
            }

            // 2. Direct Auto-Play Song on YouTube
            if (cmd.includes("play") || cmd.includes("gana") || cmd.includes("song") || cmd.includes("chalao") || cmd.includes("bajao")) {
                let track = cmd.replace("play", "").replace("gana", "").replace("song", "").replace("chalao", "").replace("bajao", "").replace("jarvis", "").trim();
                if (!track) track = "Arijit Singh trending songs";
                
                speak(`Thik hai Boss, ${track} YouTube par chala raha hu.`);
                setTimeout(() => {
                    window.location.href = `https://www.youtube.com/results?search_query=${encodeURIComponent(track)}`;
                }, 2200);
                return true;
            }

            // 3. Open Gallery
            if (cmd.includes("gallery") || cmd.includes("photos") || cmd.includes("photo")) {
                speak("Gallery open kar raha hu Boss.");
                window.open("content://media/internal/images/media", "_blank");
                return true;
            }

            // 4. Calling System
            if (cmd.includes("call") || cmd.includes("phone")) {
                const words = cmd.split(" ");
                let num = words.find(w => /^\d+$/.test(w) && w.length >= 5);
                if (num) {
                    speak(`Number ${num} par call laga raha hu.`);
                    window.open(`tel:${num}`, "_self");
                } else {
                    speak("Calling dialer open kar raha hu.");
                    window.open("tel:", "_self");
                }
                return true;
            }

            return false;
        }

        function processVoiceInput(voiceText) {
            if (!voiceText.trim()) return;
            renderHoloText(voiceText, "SHIVAM BOSS");
            const handled = checkCustomCommands(voiceText);
            if (!handled) {
                queryGroqAI(voiceText);
            }
        }

        const SpeechEngine = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognizer = null;

        if (SpeechEngine) {
            recognizer = new SpeechEngine();
            recognizer.lang = "hi-IN";
            recognizer.continuous = false;

            recognizer.onresult = (evt) => {
                const query = evt.results[0][0].transcript;
                processVoiceInput(query);
            };

            recognizer.onerror = () => {
                setSleepState();
            };

            recognizer.onend = () => {
                if (!currentAudio && !window.speechSynthesis.speaking) {
                    setSleepState();
                }
            };
        }

        function setSleepState() {
            isListening = false;
            arcCore.className = "arc-wrapper sleeping";
            jarvisState.innerText = "JARVIS SLEEPING";
            btnIcon.innerText = "▶ WAKE UP & TALK";
        }

        function setWakeState() {
            isListening = true;
            arcCore.className = "arc-wrapper";
            jarvisState.innerText = "LISTENING...";
            btnIcon.innerText = "⏸ PAUSE / SLEEP";
            renderHoloText("Sun raha hu Boss, boliye...", "JARVIS");
            if (recognizer) recognizer.start();
        }

        toggleBtn.addEventListener("click", () => {
            if (!isListening) {
                setWakeState();
            } else {
                if (currentAudio) currentAudio.pause();
                window.speechSynthesis.cancel();
                if (recognizer) recognizer.stop();
                setSleepState();
                renderHoloText("System suspended. Press play to interact.", "JARVIS");
            }
        });

        window.onload = () => {
            setSleepState();
            if (window.speechSynthesis) {
                window.speechSynthesis.getVoices();
            }
        };
    </script>
</body>
      </html>
