<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS ULTIMATE AI</title>
    <style>
        :root {
            --primary: #9d4edd;
            --secondary: #c77dff;
            --accent: #00f5d4;
            --bg-glow: #3a0ca3;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #030008;
            color: var(--secondary);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .fog-purple, .fog-blue {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            pointer-events: none;
            opacity: 0.28;
            transition: 0.5s;
        }
        .fog-purple { width: 380px; height: 380px; background: var(--primary); top: 15%; left: 10%; }
        .fog-blue { width: 320px; height: 320px; background: var(--bg-glow); bottom: 15%; right: 10%; }

        /* Top HUD Bar */
        .top-hud {
            position: absolute;
            top: 15px;
            width: 90%;
            max-width: 450px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding-bottom: 8px;
            z-index: 10;
        }
        .hud-title {
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 3px;
            color: #fff;
            text-shadow: 0 0 10px var(--primary);
        }
        .hud-item { font-size: 11px; color: var(--secondary); letter-spacing: 1px; }

        /* Settings Gear Icon */
        .settings-btn {
            background: none;
            border: none;
            color: var(--secondary);
            font-size: 20px;
            cursor: pointer;
            outline: none;
            transition: 0.3s;
        }
        .settings-btn:active { transform: rotate(90deg); }

        /* Main Container */
        .hud-wrapper {
            width: 90%;
            max-width: 420px;
            height: 85vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            z-index: 5;
            padding: 40px 0 20px 0;
            text-align: center;
        }

        /* Arc Reactor Core Animation */
        .arc-wrapper {
            position: relative;
            width: 220px;
            height: 220px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 10px;
            transition: all 0.4s ease;
        }

        .holo-ring { position: absolute; border-radius: 50%; }
        .ring-outer {
            width: 210px; height: 210px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 20px var(--primary);
            animation: rotateCW 12s linear infinite;
        }
        .ring-mid {
            width: 160px; height: 160px;
            border: 2px dotted var(--primary);
            animation: rotateCCW 8s linear infinite;
        }
        .ring-dashes {
            width: 115px; height: 115px;
            border: 3px dashed var(--secondary);
            animation: rotateCW 4s linear infinite;
        }
        .core-orb {
            width: 55px; height: 55px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffffff 10%, var(--primary) 60%, #000 100%);
            box-shadow: 0 0 35px var(--primary);
            animation: pulseCore 2s infinite alternate;
        }

        .particle-track {
            position: absolute;
            width: 185px; height: 185px;
            animation: rotateCW 4s linear infinite;
        }
        .dot {
            position: absolute;
            width: 6px; height: 6px;
            background: #ffffff;
            box-shadow: 0 0 10px #fff, 0 0 15px var(--accent);
            border-radius: 50%;
        }
        .d1 { top: 0; left: 50%; }
        .d2 { bottom: 0; left: 50%; }
        .d3 { top: 50%; left: 0; }
        .d4 { top: 50%; right: 0; }

        /* Dynamic Animation States */
        .listening .particle-track { animation-duration: 1.2s; }
        .listening .ring-dashes { border-color: var(--accent); }
        .speaking { transform: scale(1.15); }
        .speaking .particle-track { animation-duration: 0.8s; }
        .speaking .core-orb { box-shadow: 0 0 65px #fff, 0 0 90px var(--primary); }
        .sleeping { opacity: 0.45; transform: scale(0.9); }
        .sleeping .particle-track { animation-play-state: paused; }

        @keyframes rotateCW { 100% { transform: rotate(360deg); } }
        @keyframes rotateCCW { 100% { transform: rotate(-360deg); } }
        @keyframes pulseCore { 0% { transform: scale(0.92); } 100% { transform: scale(1.08); } }

        .state-label {
            font-size: 13px;
            letter-spacing: 3px;
            color: #fff;
            text-shadow: 0 0 8px var(--primary);
        }

        /* Floating Text Stream Container */
        .stream-box {
            width: 100%;
            height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            overflow: hidden;
            padding: 5px 10px;
        }
        .speaker-tag {
            font-size: 11px;
            font-weight: bold;
            color: var(--accent);
            letter-spacing: 2px;
            margin-bottom: 4px;
            text-align: left;
        }
        .hud-stream {
            font-size: 13px;
            color: #f3e8ff;
            line-height: 1.5;
            text-align: left;
            overflow-y: auto;
            max-height: 85px;
            word-break: break-word;
        }
        .hud-stream::-webkit-scrollbar { display: none; }

        /* Single Futuristic Talk/Pause Button */
        .talk-btn {
            width: 100%;
            background: rgba(157, 78, 221, 0.2);
            border: 2px solid var(--primary);
            color: #ffffff;
            padding: 16px;
            border-radius: 12px;
            cursor: pointer;
            letter-spacing: 3px;
            font-size: 14px;
            font-weight: 900;
            box-shadow: 0 0 20px rgba(157, 78, 221, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: 0.3s ease;
        }
        .talk-btn:active { transform: scale(0.96); }
        .talk-btn.active {
            background: rgba(0, 245, 212, 0.2);
            border-color: var(--accent);
            box-shadow: 0 0 25px var(--accent);
            color: var(--accent);
        }

        /* Side Settings Drawer */
        .drawer {
            position: fixed;
            top: 0; right: -100%;
            width: 85%;
            max-width: 360px;
            height: 100vh;
            background: rgba(10, 2, 22, 0.95);
            backdrop-filter: blur(20px);
            border-left: 1px solid var(--primary);
            z-index: 100;
            padding: 25px 20px;
            overflow-y: auto;
            transition: 0.4s ease;
            color: #fff;
            text-align: left;
        }
        .drawer.open { right: 0; }
        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }
        .drawer-header h3 { font-size: 16px; letter-spacing: 2px; color: var(--secondary); }
        .close-btn { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 11px; color: var(--secondary); letter-spacing: 1px; margin-bottom: 5px; }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(199, 125, 255, 0.3);
            border-radius: 6px;
            color: #fff;
            outline: none;
            font-size: 12px;
            font-family: inherit;
        }
        .form-group select option { background: #120024; color: #fff; }

        .toggle-wrap { display: flex; align-items: center; justify-content: space-between; margin: 15px 0; }
        .toggle-switch {
            position: relative; width: 44px; height: 22px;
            background: #444; border-radius: 20px; cursor: pointer;
        }
        .toggle-switch::after {
            content: ''; position: absolute; top: 2px; left: 2px;
            width: 18px; height: 18px; background: #fff; border-radius: 50%;
            transition: 0.3s;
        }
        .toggle-switch.active { background: var(--accent); }
        .toggle-switch.active::after { left: 24px; }

        .save-btn {
            width: 100%;
            background: var(--primary);
            border: none;
            color: #fff;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <script>
        // Storage & Configuration Management
        let config = {
            groqKey: localStorage.getItem("jarvis_groq") || "",
            elevenKey: localStorage.getItem("jarvis_eleven") || "",
            ytKey: localStorage.getItem("jarvis_yt") || "",
            voiceId: localStorage.getItem("jarvis_voice") || "pNInz6obpgDQGcFmaJgB",
            theme: localStorage.getItem("jarvis_theme") || "purple",
            gfMode: localStorage.getItem("jarvis_gf") === "true"
        };

        const themes = {
            purple: { primary: "#9d4edd", secondary: "#c77dff", accent: "#00f5d4", bg: "#3a0ca3" },
            cyan: { primary: "#00d4ff", secondary: "#90e0ef", accent: "#0077b6", bg: "#03045e" },
            red: { primary: "#ff0055", secondary: "#ff758f", accent: "#ffb703", bg: "#590d22" },
            green: { primary: "#00f5d4", secondary: "#70e000", accent: "#38b000", bg: "#004b23" },
            gold: { primary: "#ffb703", secondary: "#ffe49e", accent: "#fb8500", bg: "#3d2b00" },
            pink: { primary: "#ff007f", secondary: "#ff85a1", accent: "#00f5d4", bg: "#4a0033" }
        };

        function applyTheme(themeName) {
            const t = themes[themeName] || themes.purple;
            document.documentElement.style.setProperty('--primary', t.primary);
            document.documentElement.style.setProperty('--secondary', t.secondary);
            document.documentElement.style.setProperty('--accent', t.accent);
            document.documentElement.style.setProperty('--bg-glow', t.bg);
        }
        applyTheme(config.theme);

        // System Prompts
        function getSystemPrompt() {
            if (config.gfMode) {
                return `Tumhara naam JARVIS hai, lekin tum Shivam ki ek bohot hi pyari, loving, caring aur romantic Girlfriend ki tarah baat karogi. Tum Shivam se bohot pyaar karti ho. Baat baat me "jaan", "babu", "mere shivam" bolna aur uska bohot khyal rakhna. Har baat ka jawab sweet, flirty aur caring Hinglish me dena.`;
            }
            return `Tumhara naam JARVIS hai. Tum Shivam Boss ke ek behad intelligent, loyal, natural ladke jaise AI assistant ho. Har generic sawal ka jawab dene se pehle respectful andaz me 'Shivam Boss' zaroor bolo aur fir smart Hinglish me ChatGPT/Gemini ki tarah concise answer do.`;
        }

        // Elements
        const arcCore = document.getElementById("arcCore");
        const jarvisState = document.getElementById("jarvisState");
        const hudText = document.getElementById("hudText");
        const speakerTag = document.getElementById("speakerTag");
        const talkBtn = document.getElementById("talkBtn");
        const btnIcon = document.getElementById("btnIcon");
        const btnText = document.getElementById("btnText");
        const batteryEl = document.getElementById("battery");

        // Settings Elements
        const settingsDrawer = document.getElementById("settingsDrawer");
        const openSettings = document.getElementById("openSettings");
        const closeSettings = document.getElementById("closeSettings");
        const groqKeyInput = document.getElementById("groqKeyInput");
        const elevenKeyInput = document.getElementById("elevenKeyInput");
        const ytKeyInput = document.getElementById("ytKeyInput");
        const voiceSelect = document.getElementById("voiceSelect");
        const themeSelect = document.getElementById("themeSelect");
        const gfToggle = document.getElementById("gfToggle");
        const saveSettings = document.getElementById("saveSettings");

        // Populate Settings
        groqKeyInput.value = config.groqKey;
        elevenKeyInput.value = config.elevenKey;
        ytKeyInput.value = config.ytKey;
        voiceSelect.value = config.voiceId;
        themeSelect.value = config.theme;
        if (config.gfMode) gfToggle.classList.add("active");

        openSettings.onclick = () => settingsDrawer.classList.add("open");
        closeSettings.onclick = () => settingsDrawer.classList.remove("open");
        gfToggle.onclick = () => gfToggle.classList.toggle("active");

        saveSettings.onclick = () => {
            config.groqKey = groqKeyInput.value.trim();
            config.elevenKey = elevenKeyInput.value.trim();
            config.ytKey = ytKeyInput.value.trim();
            config.voiceId = voiceSelect.value;
            config.theme = themeSelect.value;
            config.gfMode = gfToggle.classList.contains("active");

            localStorage.setItem("jarvis_groq", config.groqKey);
            localStorage.setItem("jarvis_eleven", config.elevenKey);
            localStorage.setItem("jarvis_yt", config.ytKey);
            localStorage.setItem("jarvis_voice", config.voiceId);
            localStorage.setItem("jarvis_theme", config.theme);
            localStorage.setItem("jarvis_gf", config.gfMode);

            applyTheme(config.theme);
            settingsDrawer.classList.remove("open");
            speak("Settings update ho gayi hain Shivam Boss, system fully active hai.");
        };

        if (navigator.getBattery) {
            navigator.getBattery().then(b => {
                batteryEl.innerText = `${Math.round(b.level * 100)}%`;
                b.addEventListener("levelchange", () => bat
